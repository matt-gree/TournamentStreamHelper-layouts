<html>
  <head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="../main.css">
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <div class="main-container">
      <div id="live-container">
        <div class="row-username">
          <div id="home-player" class="username-home"></div>
          <div id="away-player" class="username-away"></div>
        </div>
        <div class="row-score-logos">
          <div class="logo"><img id="home-logo" src="" alt="Home logo"></div>
          <div id="home-score" class="score"></div>
          <div id="inning" class="inning"></div>
          <div id="away-score" class="score"></div>
          <div class="logo"><img id="away-logo" src="" alt="Away logo"></div>
        </div>
        <div class="row-situation">
          <div class="offDef"><img id="left-offdef" src=""></div>
          <div class="character"><img id="left-character" src=""></div>
          <div class="bases-count">
            <div class="bases"><img id="bases" src=""></div>
            <div id="outs" class="count"></div>
          </div>
          <div class="character"><img id="right-character" src=""></div>
          <div class="offDef"><img id="right-offdef" src=""></div>
        </div>
      </div>
    </div>
    <script src="index.js"></script>
  </body>
</html>
